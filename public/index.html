<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ServerManager - Administrador de Servidores</title>
  <link rel="stylesheet" href="./assets/base.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link href="./assets/materialSymbols.css" rel="stylesheet" />
  <script src="./utils/logger.js"></script>
  <script src="./js/webcomponents.js"></script>
  <script type="module" src="./pages/servermenu.js"></script>
  <script src="pages/header.js"></script>
  <style>

  </style>
</head>
<body>

  <header>

  </header>
  <custom-popup id="server-options" class="material-symbols-rounded">
  </custom-popup>
  <main>
    <h1 class="page-title">Servers</h1>
    
    <div class="promo-banner">
      <span>Boost your server's performance with free additional RAM for a better gameplay.</span>
      <button class="btn btn-primary">
        <i class="fas fa-bolt"></i>
        Get your free RAM boost
      </button>
    </div>

    <div class="actions-bar">
      <button class="btn btn-primary w-auto">
        <i class="fas fa-plus"></i>
        Create
      </button>
    </div>

    <div class="server-list">
      <server-menu id="serverMenu"></server-menu>
    </div>

    <div class="dashboard-cards">
      <div class="card">
        <h3>Resumen</h3>
        <p>Servidores activos: <strong id="activeServers">1</strong></p>
        <p>Estado general: <strong>Óptimo</strong></p>
      </div>  
      <div class="card">
        <h3>Actividad Reciente</h3>
        <p>Último inicio: <strong>Hace 2 horas</strong></p>
        <p>Última actualización: <strong>Ayer</strong></p>
      </div>
    </div>
  </main>

  <script>
    // Inicializar con algunos servidores de ejemplo
    document.addEventListener('DOMContentLoaded', () => {


      // Acción para el botón de crear
      document.querySelector('.actions-bar .btn-primary').addEventListener('click', () => {
        console.log('Botón de crear');
        location.href = 'newServer.html';
      });



      // Acción para el banner promocional
      document.querySelector('.promo-banner .btn-primary').addEventListener('click', () => {
        alert('Obteniendo RAM adicional...');
      });

    });
  </script>
</body>
