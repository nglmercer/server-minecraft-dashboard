<!DOCTYPE html>
<html>
<head>
  <!-- Highlight.js CSS -->
  <link id="highlightTheme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/monokai.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
</head>
<body>
  <h1>Code Editor with Live Preview</h1>
  <select onchange="switchTheme(this.value)">
    <option value="default">Tema Default</option>
    <option value="monokai">Tema Monokai</option>
    <option value="atom-one-dark">Tema Atom Dark</option>
    <option value="vs2015">Tema VS 2015</option>
  </select>
  
  <!-- Combined Editor-Preview Area -->
  <div id="editor" style="width: 90%; height: 80vh; border: 1px solid #ccc; padding: 10px; font-family: monospace;">
    <pre><code id="code-editor" contenteditable="true" spellcheck="false"></code></pre>
  </div>

  <script>
// Get the code editor element
const codeEditor = document.getElementById('code-editor');

// Highlight initial code
hljs.highlightElement(codeEditor);

// Debounce function to limit the frequency of updates
function debounce(func, wait) {
  let timeout;
  return function (...args) {
    clearTimeout(timeout);
    timeout = setTimeout(() => func.apply(this, args), wait);
  };
}

// Function to save the current cursor position
function saveCursorPosition(element) {
  const selection = window.getSelection();
  let cursorPosition = 0;
  if (selection.rangeCount) {
    const range = selection.getRangeAt(0);
    const preCaretRange = range.cloneRange();
    preCaretRange.selectNodeContents(element);
    preCaretRange.setEnd(range.endContainer, range.endOffset);
    cursorPosition = preCaretRange.toString().length;
  }
  return cursorPosition;
}

// Function to restore the cursor position in a complex node structure
function restoreCursorPosition(element, cursorPosition) {
  const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
  let currentPosition = 0;
  let targetNode = null;
  let targetOffset = 0;

  while (walker.nextNode()) {
    const node = walker.currentNode;
    const nodeLength = node.length;

    if (currentPosition + nodeLength >= cursorPosition) {
      targetNode = node;
      targetOffset = cursorPosition - currentPosition;
      break;
    }
    currentPosition += nodeLength;
  }

  if (targetNode) {
    const range = document.createRange();
    range.setStart(targetNode, targetOffset);
    range.collapse(true);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    console.log(`Cursor restored to position: ${cursorPosition}`);
  } else {
    console.error('Cursor position could not be restored');
  }
}

// Function to update the highlight
function updateHighlight() {
  // Save the current cursor position
  const cursorPosition = saveCursorPosition(codeEditor);
  console.log(`Cursor position before update: ${cursorPosition}`);

  // Get the code content
  const code = codeEditor.textContent;

  // Highlight the code
  const result = hljs.highlightAuto(code);
  console.log(`Language detected: ${result.language}`, result.value);
  codeEditor.innerHTML = result.value;

  // Restore the cursor position
  restoreCursorPosition(codeEditor, cursorPosition);
}

// Debounced version of the updateHighlight function with a longer delay (1 second)
const debouncedUpdateHighlight = debounce(updateHighlight, 1000);

// Listen for input events
codeEditor.addEventListener('input', debouncedUpdateHighlight);

// Handle paste event to preserve spaces and line breaks
codeEditor.addEventListener('paste', (event) => {
  event.preventDefault(); // Prevent default paste behavior

  // Get pasted text
  const text = (event.clipboardData || window.clipboardData).getData('text');

  // Insert the pasted text at the cursor position
  const selection = window.getSelection();
  if (selection.rangeCount) {
    const range = selection.getRangeAt(0);
    range.deleteContents(); // Remove any selected text
    range.insertNode(document.createTextNode(text)); // Insert the pasted text
  }

  // Trigger input event to update highlighting
  const inputEvent = new Event('input', { bubbles: true });
  codeEditor.dispatchEvent(inputEvent);
});

// Configure Highlight.js to only use specific languages
hljs.configure({
  languages: ['javascript', 'yaml', 'html', 'css', 'json']
});
  </script>

  <script>
    function switchTheme(theme) {
      document.getElementById('highlightTheme').href = 
        `https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/${theme}.min.css`;
      hljs.highlightAll(); // Re-highlight all elements with the new theme
    }
  </script>
</body>
</html>
